<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Raleway:wght@300;500&display=swap"
    />
    <link rel="stylesheet" href="./assets/css/main.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23555'/%3E%3Ctext x='16' y='23' font-family='Montserrat,Arial,sans-serif' font-size='22' font-weight='700' text-anchor='middle' fill='white'%3EM%3C/text%3E%3C/svg%3E"
    />
    <style>
      /* Only the bits main.css does not already provide: center the page. */
      #wrapper {
        text-align: center;
      }
      #wrapper header > :first-child::after {
        margin-left: auto;
        margin-right: auto;
      }
    </style>
  </head>
  <body>
    <div id="wrapper">
      <header>
        <h1>404</h1>
        <p>Page not found</p>
      </header>
      <p>The page you're looking for doesn't exist.</p>
      <a href="/" class="button">Back home</a>
    </div>
  </body>
</html>
